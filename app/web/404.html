<!-- The web build's 404 (docs/v2/web.md §1): Cloudflare Pages serves it, with a 404, for any path it has no file for, at
     any depth (/audio/gone.mp4, /a/b/c), so every link is from the site's root. Without it Pages would answer a lost
     voice pack with index.html and a 200, which fails to decode instead of failing as files.js reports. No script. -->
<style>
:root { color-scheme: dark; --ink: #0f0d13; --paper: #f7f2e8; --mute: #aaa3b5; --red: #ff4d5e; --gold: #ffc53d; --sky: #69b7ff;
  --display: 'ZCOOL KuaiLe', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif; }
html { background: var(--ink); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; text-align: center; }
main { box-sizing: border-box; max-width: 420px; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mark { font: 400 56px/1 var(--display); color: var(--red); text-decoration: none; }
h1 { margin: 20px 0 6px; font: 400 40px/1.1 var(--display); color: var(--gold); }
h1 small { display: block; margin-top: 6px; font: 600 15px/1.3 var(--body); color: var(--mute); }
p { margin: 0 0 22px; }
.play { display: inline-block; padding: 12px 24px; border-radius: 99px; background: var(--paper); color: var(--ink); font-weight: 700; text-decoration: none; }
.about { display: inline-block; margin-left: 14px; color: var(--mute); font-size: 14px; text-underline-offset: 3px; }
</style>
